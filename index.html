<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roland-System - Marriage & Events</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:system-ui} .card{box-shadow:0 10px 30px rgba(0,0,0,.08)}</style>
</head>
<body class="bg-[#FFF8F0] min-h-screen">
<header class="bg-[#1A1A1A] text-white p-4 sticky top-0 z-10">
<div class="max-w-5xl mx-auto flex justify-between items-center">
<h1 class="font-black text-xl">💍 Roland-System <span class="text-amber-400">Events</span></h1>
<span class="text-xs bg-green-500 px-2 py-1 rounded-full">● LIVE • Supabase Connected</span>
</div>
</header>
<main class="max-w-5xl mx-auto p-4 space-y-6">
<div class="bg-white rounded-2xl p-5 card">
<h2 class="font-bold text-lg mb-3">1. Create New Event</h2>
<div class="grid md:grid-cols-2 gap-3">
<input id="eName" placeholder="Event Name e.g. Calvin & Amina Wedding" class="border p-3 rounded-xl w-full">
<input id="eDate" type="date" class="border p-3 rounded-xl w-full">
<input id="ePlace" placeholder="Place e.g. Kampala Serena" class="border p-3 rounded-xl w-full">
<input id="eDesc" placeholder="Description e.g. Traditional Introduction" class="border p-3 rounded-xl w-full">
</div>
<button onclick="createEvent()" class="mt-3 bg-black text-white px-6 py-3 rounded-xl font-bold w-full md:w-auto">+ Create Event</button>
<p id="eMsg" class="text-sm mt-2 text-green-600"></p>
</div>
<div class="bg-white rounded-2xl p-5 card">
<h2 class="font-bold text-lg mb-3">Your Events</h2>
<div id="eventsList" class="space-y-3"><p class="text-gray-400">Loading...</p></div>
</div>
<div class="bg-[#1A1A1A] text-white rounded-2xl p-5 card">
<h2 class="font-bold text-lg mb-1">2. Guest RSVP</h2>
<p class="text-sm text-gray-300 mb-3">Share this page with guests. They fill this form.</p>
<select id="rsvpEvent" class="w-full text-black border p-3 rounded-xl mb-3"><option>Select Event...</option></select>
<div class="grid md:grid-cols-2 gap-3">
<input id="gName" placeholder="Full Name" class="text-black border p-3 rounded-xl w-full">
<input id="gPhone" placeholder="Phone e.g. 0700..." class="text-black border p-3 rounded-xl w-full">
<select id="gAttend" class="text-black border p-3 rounded-xl w-full"><option value="Yes">Yes, I will attend</option><option value="No">No, I can't</option><option value="Maybe">Maybe</option></select>
<input id="gDiet" placeholder="Diet / Allergies (optional)" class="text-black border p-3 rounded-xl w-full">
</div>
<button onclick="addGuest()" class="mt-3 bg-amber-400 text-black px-6 py-3 rounded-xl font-black w-full">Send RSVP → Get My Code</button>
<div id="rsvpResult" class="mt-3 hidden bg-green-500 text-white p-4 rounded-xl font-bold text-center"></div>
</div>
<div class="bg-white rounded-2xl p-5 card">
<h2 class="font-bold text-lg mb-3">3. Guest List & Check-In (Admin)</h2>
<div class="flex gap-2 mb-3">
<input id="searchCode" placeholder="Search by name or code..." class="border p-3 rounded-xl flex-1">
<button onclick="loadGuests()" class="bg-black text-white px-4 rounded-xl">Refresh</button>
</div>
<div id="guestsList" class="space-y-2"><p class="text-gray-400">No guests yet.</p></div>
</div>
</main>
<script>
const SUPABASE_URL = "https://yakegctebdenjlqhzas.supabase.co";
const SUPABASE_KEY = "sb_publishable_tFwukIVI5jauIgFOUV_Kww_c-MeudES";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentEventId = null;
async function loadEvents(){
  const {data, error} = await supabase.from('events').select('*').order('created_at',{ascending:false});
  if(error){ document.getElementById('eventsList').innerHTML = 'Error: '+error.message; return; }
  const list = document.getElementById('eventsList');
  const sel = document.getElementById('rsvpEvent');
  if(!data.length){ list.innerHTML='<p class="text-gray-400">No events yet. Create one above.</p>'; return; }
  list.innerHTML = data.map(e=>`<div class="border rounded-xl p-4 flex justify-between items-center"><div><p class="font-bold">${e.name}</p><p class="text-sm text-gray-500">${e.event_date||''} • ${e.place||''} • ${e.description||''}</p></div><button onclick="selectEvent(${e.id},'${e.name.replace(/'/g,"")}')" class="bg-amber-400 px-3 py-2 rounded-lg text-sm font-bold">Select for RSVP</button></div>`).join('');
  sel.innerHTML = data.map(e=>`<option value="${e.id}">${e.name} - ${e.event_date||''}</option>`).join('');
  if(!currentEventId) currentEventId = data[0].id;
  loadGuests();
}
function selectEvent(id,name){
  currentEventId=id; document.getElementById('rsvpEvent').value=id;
  document.getElementById('eMsg').textContent = 'Selected: '+name;
  loadGuests();
}
async function createEvent(){
  const name=document.getElementById('eName').value.trim();
  if(!name) return alert('Enter event name');
  const {error}=await supabase.from('events').insert([{name, event_date:document.getElementById('eDate').value, place:document.getElementById('ePlace').value, description:document.getElementById('eDesc').value}]);
  if(error) return alert(error.message);
  document.getElementById('eMsg').textContent='✅ Event created! It is now live in Supabase.';
  document.getElementById('eName').value=''; loadEvents();
}
async function addGuest(){
  const event_id = document.getElementById('rsvpEvent').value;
  const name=document.getElementById('gName').value.trim();
  const phone=document.getElementById('gPhone').value.trim();
  if(!event_id||!name||!phone) return alert('Fill Event, Name and Phone');
  const code = 'CAL-'+Math.random().toString(36).slice(2,7).toUpperCase();
  const {error}=await supabase.from('guests').insert([{event_id: Number(event_id), name, phone, attending:document.getElementById('gAttend').value, diet:document.getElementById('gDiet').value, code}]);
  if(error) return alert(error.message);
  const box=document.getElementById('rsvpResult');
  box.classList.remove('hidden');
  box.innerHTML=`🎉 Thank you ${name}! Your Check-In Code is: <span class="text-2xl">${code}</span><br>Save this code. Show it at the entrance.`;
  document.getElementById('gName').value=''; document.getElementById('gPhone').value='';
  loadGuests();
}
async function loadGuests(){
  const q=document.getElementById('searchCode').value.toLowerCase();
  let query = supabase.from('guests').select('*').order('created_at',{ascending:false});
  if(currentEventId) query = query.eq('event_id', currentEventId);
  const {data}=await query;
  const box=document.getElementById('guestsList');
  if(!data||!data.length){ box.innerHTML='<p class="text-gray-400">No guests yet for this event.</p>'; return; }
  const filtered = data.filter(g=> !q || g.name.toLowerCase().includes(q) || g.code.toLowerCase().includes(q));
  box.innerHTML = filtered.map(g=>`<div class="border rounded-xl p-3 flex justify-between items-center ${g.checked?'bg-green-50':''}"><div><p class="font-bold">${g.name} <span class="text-xs bg-black text-white px-2 py-0.5 rounded-full">${g.code}</span></p><p class="text-sm text-gray-500">${g.phone} • ${g.attending} • ${g.diet||'No diet'}</p></div><button onclick="toggleCheck(${g.id},${!g.checked})" class="px-3 py-2 rounded-lg font-bold text-sm ${g.checked?'bg-green-500 text-white':'bg-gray-100'}">${g.checked?'✅ Checked In':'Check In'}</button></div>`).join('') + `<p class="text-sm font-bold mt-2">Total: ${filtered.length} guests • Checked In: ${filtered.filter(g=>g.checked).length}</p>`;
}
async function toggleCheck(id,val){
  await supabase.from('guests').update({checked:val}).eq('id',id);
  loadGuests();
}
document.getElementById('rsvpEvent').addEventListener('change', e=>{ currentEventId=Number(e.target.value); loadGuests(); });
document.getElementById('searchCode').addEventListener('input', loadGuests);
loadEvents();
</script>
</body>
</html>
